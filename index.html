    <script>
      // Apply the saved light / dark mode before the first paint.
      (function() {
        var theme;
        try { theme = localStorage.getItem('streetdata-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
      // Chrome can offer installation before the app script runs; keep it.
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__installPromptEvent = e;
      });
    </script>
